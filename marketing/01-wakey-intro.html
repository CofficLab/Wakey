<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2560">
<title>Wakey — Your Work Companion</title>
<link rel="stylesheet" href="components.css">
<style>
  body { margin: 0; display: flex; justify-content: center; background: #000; }
  .bg-icon-drop { top: 25%; left: 22%; transform: rotate(-10deg); }
  .bg-icon-eye { top: 15%; right: 20%; transform: rotate(8deg); }
  .bg-icon-figure { bottom: 18%; right: 25%; transform: rotate(5deg); }
  .bg-icon-bolt { bottom: 22%; left: 28%; transform: rotate(-12deg); }
  .menu-bar-wakey { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .menu-bar-wakey .icon { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
  .menu-bar-wakey .icon svg { width: 14px; height: 14px; fill: var(--c-accent); stroke: none; }
  .popup-window { width: 320px; }
  .popup-section { padding: 8px 12px; }
  .popup-section + .popup-section { border-top: 1px solid rgba(255,255,255,0.06); }
  .popup-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.88); }
  .popup-row.active { background: rgba(255,159,10,0.14); }
  .popup-row svg { width: 15px; height: 15px; fill: none; stroke: var(--c-secondary); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .popup-row.active svg { stroke: var(--c-accent); fill: var(--c-accent); }
  .popup-row .label { flex: 1; }
  .popup-row .status { font-size: 11px; color: var(--c-muted); }
  .popup-row .dot { width: 7px; height: 7px; border-radius: 50%; }
  .popup-row .dot.on { background: var(--c-green); }
  .popup-row .dot.off { background: var(--c-muted); }
  .screenshot-mock {
    width: 380px; background: rgba(30,30,35,0.92);
    border-radius: 14px; border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    overflow: hidden; backdrop-filter: blur(40px);
  }
</style>
</head>
<body>
<div class="stage">
  <!-- Background -->
  <div class="poster-bg">
    <div class="bg-circle-blue"></div>
    <div class="bg-circle-green"></div>
    <div class="bg-circle-purple"></div>
    <div class="bg-circle-orange"></div>
    <svg class="bg-icon bg-icon-drop" width="200" height="200" viewBox="0 0 24 24" fill="rgba(0,122,255,0.06)"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
    <svg class="bg-icon bg-icon-eye" width="160" height="160" viewBox="0 0 24 24" fill="rgba(52,199,89,0.06)"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    <svg class="bg-icon bg-icon-figure" width="180" height="180" viewBox="0 0 24 24" fill="rgba(175,82,222,0.05)"><circle cx="12" cy="5" r="3"/><path d="M12 8v5m-4 4l4-4 4 4m-8-4h8"/></svg>
    <svg class="bg-icon bg-icon-bolt" width="140" height="140" viewBox="0 0 24 24" fill="rgba(255,159,10,0.06)"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
  </div>

  <!-- Content -->
  <div class="poster-content">
    <!-- Left -->
    <div class="poster-left">
      <div class="poster-title">Wakey</div>
      <div class="poster-subtitle">Your work companion</div>
      <div class="feature-list">
        <div class="feature-item">
          <div class="feature-icon outline">
            <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5"/></svg>
          </div>
          <div class="feature-text">
            <div class="feature-name">Quick Menu</div>
            <div class="feature-desc">Quickly switch different anti-sleep modes via status bar menu</div>
          </div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          </div>
          <div class="feature-text">
            <div class="feature-name">Ultra Lightweight</div>
            <div class="feature-desc">Low resource usage, runs silently without interruption</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Mockup -->
    <div class="poster-right">
      <div class="screenshot-mock">
        <!-- Menu bar -->
        <div class="menu-bar">
          <span class="apple">🍎</span>
          <span class="app-name">Finder</span>
          <span>File</span>
          <span>Edit</span>
          <span>View</span>
          <span>Go</span>
          <span>Window</span>
          <span>Help</span>
          <div class="menu-bar-wakey">
            <div class="icon">
              <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </div>
          </div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/></svg>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"><rect x="1" y="6" width="18" height="12" rx="2"/><line x1="23" y1="13" x2="23" y2="11"/></svg>
        </div>

        <!-- Popup content -->
        <div class="popup-section">
          <div class="popup-row active">
            <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            <span class="label">Caffeinate</span>
            <span class="dot on"></span>
          </div>
          <div class="popup-row">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <span class="label">Eye Care</span>
            <span class="dot on"></span>
          </div>
          <div class="popup-row">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="3"/><path d="M12 8v5"/><path d="M8 17l4-4 4 4"/></svg>
            <span class="label">Stretch</span>
            <span class="dot off"></span>
          </div>
          <div class="popup-row">
            <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
            <span class="label">Hydration</span>
            <span class="dot on"></span>
          </div>
        </div>
        <div class="popup-section">
          <div class="popup-row">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4"/></svg>
            <span class="label">Settings…</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
